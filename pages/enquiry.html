<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الاستفسار عن كورس | معهد coderz</title>
  </head>

  <body>
    <header>
      <h1>الاستفسار عن كورس</h1>
      <nav>
        <a href="../index.html">الرئيسية</a>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <a href="schedule.html">المواعيد</a>
        &nbsp;&nbsp;&nbsp;&nbsp;
        <a href="enquiry.html">الاستفسار</a>
      </nav>
    </header>
    <main>
      <p>عندك سؤال عن أحد الكورسات؟ املأ النموذج وسنرد عليك في أقرب وقت.</p>

      <form>
        <h2>استفسر عن كورس</h2>

        <p>
          <label for="full-name">الاسم الكامل</label><br />
          <input type="text" id="full-name" name="full_name" placeholder="مثال: أحمد محمد علي" autocomplete="name" />
        </p>

        <p>
          <label for="email">البريد الإلكتروني</label><br />
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" />
        </p>

        <p>
          <label for="phone">رقم الهاتف</label><br />
          <input type="tel" id="phone" name="phone" autocomplete="tel" />
        </p>

        <p>
          <label for="course">الكورس</label><br />
          <select id="course" name="course">
            <option value="">اختر كورسًا</option>
            <option value="content">HTML Content</option>
            <option value="forms">HTML Forms</option>
          </select>
        </p>

        <p>
          <label for="seats">عدد المقاعد</label><br />
          <input type="number" id="seats" name="seats" value="1" min="1" />
        </p>

        <p>
          <label for="preferred-date">التاريخ المفضل</label><br />
          <input type="date" id="preferred-date" name="preferred_date" />
        </p>

        <p>
          <label for="message">نص الاستفسار</label><br />
          <textarea id="message" name="message" rows="5" cols="40"></textarea>
        </p>

        <button type="submit">أرسل الاستفسار</button>
      </form>

      <p>أو راسل قسم التسجيل مباشرة: <a href="mailto:registration@example.com">راسل قسم التسجيل</a></p>
    </main>
  </body>
</html>
